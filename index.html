const catalog=rawCatalog.map((b,i)=>({title:b[0],authors:b[1],publisher:b[2],subject:b[3],grades:b[4],coverPrice:b[5],isbn:makeISBN('978889990'+String(i+1).padStart(3,'0')),kind:'book',source:'Catalogo locale demo · libro inventato'}));
function seed(){const names=['giulia_4A','marco.2C','sara_3B','luca_2A','elena_4C','davide_3A','chiara_2B','nico_2D','franci_5A','marta_3C','paolo_5B','sofia_5D'];const listings=catalog.map((b,i)=>({...b,id:'a'+i,grade:b.grades[0],condition:i%4,price:Math.round(b.coverPrice*conditions[i%4].k*2)/2,notes:['Pagine complete e copertina protetta. Lo porto a scuola quando ci accordiamo.','Qualche appunto a matita. Nessuna pagina mancante.','Usato durante l’anno, foto e dettagli disponibili in chat.'][i%3],digital:i%3===0?'used':i%3===1?'unused':'none',photos:[],sellerId:'s'+i,seller:{username:names[i],className:names[i].slice(-2)},status:'available',created:Date.now()-(i*85+20)*60000}));listings.push({id:'zaino',title:'Zaino verde, pronto per un altro anno',authors:'',publisher:'',isbn:'',subject:'Altro',grade:2,coverPrice:45,condition:1,price:18,kind:'object',notes:'Cerniere funzionanti, lavato e senza strappi. Ci stanno libri e quaderni grandi.',digital:'none',photos:[],sellerId:'s12',seller:{username:'vale_3D',className:'3D'},status:'available',created:Date.now()-2500000,source:'Inserimento manuale'},{id:'calc',title:'Calcolatrice scientifica',authors:'',publisher:'',isbn:'',subject:'Altro',grade:4,coverPrice:25,condition:1,price:10,kind:'object',notes:'Funzionante, con custodia. Controlla con il docente che il modello sia adatto alle tue verifiche.',digital:'none',photos:[],sellerId:'s13',seller:{username:'anto_5C',className:'5C'},status:'available',created:Date.now()-7600000,source:'Inserimento manuale'});return{version:1,user:null,listings,chats:[],reports:[]};}
let storageOK=true,state;try{localStorage.setItem(KEY+'.test','1');localStorage.removeItem(KEY+'.test');const saved=JSON.parse(localStorage.getItem(KEY)||'null');state=saved?.version===1&&Array.isArray(saved.listings)&&Array.isArray(saved.chats)&&Array.isArray(saved.reports)?saved:seed();}catch(e){storageOK=false;state=seed();}
const ui={view:'home',q:'',subject:'',grade:'',kind:'',sort:'recent',listingId:null,chatId:null,editId:null,photos:[],source:'Inserimento manuale',lookup:0,photoIndex:0,photoBusy:false};
const timers=new Map();let toastTimer,lookupController;
function toast(msg){$('#toast').textContent=msg;$('#toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').hidden=true,4200);}
function commit(fn){const before=JSON.stringify(state);fn();try{if(storageOK)localStorage.setItem(KEY,JSON.stringify(state));}catch(e){state=JSON.parse(before);toast('Memoria piena: rimuovi qualche foto o annuncio e riprova.');return false;}return true;}
function listing(id){return state.listings.find(a=>a.id===id);}
const alive=a=>a&&!['removed','deleted'].includes(a.status), isOwn=a=>a?.sellerId===SELF, reviewed=id=>state.reports.some(r=>r.listingId===id&&r.status==='pending');
function statusBadge(a){return reviewed(a.id)?'<span class="badge warn">In revisione</span>':a.status==='reserved'?'<span class="badge blue">Prenotato</span>':a.status==='sold'?'<span class="badge">Venduto</span>':'<span class="badge">Disponibile</span>';}
function conditionBadge(a){return`<span class="badge ${a.condition===2?'warn':a.condition===3?'red':''}">${conditions[a.condition].name}</span>`;}
function elapsed(t){const m=Math.max(0,Math.floor((Date.now()-t)/60000));return m<1?'Adesso':m<60?`${m} min fa`:m<1440?`${Math.floor(m/60)} h fa`:`${Math.floor(m/1440)} g fa`;}
const time=t=>new Date(t).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
const dateLabel=s=>new Date(s+'T12:00:00').toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'short'});
function schoolDays(){const out=[],d=new Date();d.setHours(12,0,0,0);while(out.length<5){d.setDate(d.getDate()+1);if(d.getDay()!==0)out.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);}return out;}

function card(a){return`<button class="listing" data-action="detail" data-id="${a.id}" aria-label="${esc(a.title)}, ${esc(money(a.price))}"><div class="visual">${a.photos.length?`<img src="${a.photos[0]}" alt="${esc(a.title)}" loading="lazy">`:cover(a)}${a.status==='reserved'||reviewed(a.id)?`<div class="status">${statusBadge(a)}</div>`:''}</div><div class="cardbody"><span class="meta">${esc(a.subject)} · ${a.grade}ª classe</span><h3>${esc(a.title)}</h3><div>${conditionBadge(a)}</div><div class="prices"><strong>${money(a.price)}</strong><s>${money(a.coverPrice)}</s></div><div class="sellerline">${esc(a.seller.username)} · ${esc(a.seller.className)}<br>${elapsed(a.created)}</div></div></button>`;}
function empty(title,desc,action='',label=''){return`<div class="empty"><svg class="empty-art" viewBox="0 0 120 90" aria-hidden="true"><ellipse cx="60" cy="77" rx="48" ry="6" fill="#e4eddf"/><path d="M23 26h34v46H23zm40-5h31v51H63" fill="#e4eddf" stroke="currentColor" stroke-width="2"/><path d="M30 37h19m-19 8h15m25-13h17m-17 8h12M60 4v9m-6-4h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="91" cy="62" r="13" fill="#f7e5d9" stroke="#a64d30" stroke-width="2"/><path d="m100 72 9 9" stroke="#a64d30" stroke-width="4" stroke-linecap="round"/></svg><h3>${title}</h3><p>${desc}</p>${action?`<button class="btn" data-action="${action}">${label}</button>`:''}</div>`;}
function navigation(){const n=state.chats.reduce((s,c)=>s+(c.unread||0),0);$('#nav').hidden=!state.user;$('#nav').innerHTML=[['home','search','Cerca'],['sell','plus','Vendi'],['messages','chat','Messaggi'],['profile','user','Profilo']].map(([v,i,t])=>`<button class="navitem ${ui.view===v||(v==='home'&&ui.view==='detail')||(v==='messages'&&ui.view==='chat')?'active':''}" data-action="nav" data-view="${v}" ${ui.view===v?'aria-current="page"':''}>${icon(i)}<span>${t}</span>${v==='messages'&&n?`<span class="count">${n}</span>`:''}</button>`).join('');}

function onboarding(){return`<div class="onboard"><div class="onboard-intro"><span class="badge" style="justify-self:start">Un’idea per il Cartesio</span><h1>Stesso banco.<br>Nuova storia.</h1><p class="muted">Libri e oggetti che passano di mano, tra compagni di scuola. Meno spese, più seconde possibilità.</p>${art()}<div class="row small muted">${icon('pin')}Liceo Cartesio – Triggiano</div></div><form id="onboarding" class="panel stack"><h2>Ci vediamo a scuola.</h2><p class="muted" style="font-size:14px">Scegli come farti riconoscere nella demo.</p><div class="field"><label for="username">Nome utente</label><input id="username" name="username" placeholder="es. ale_3B" autocomplete="off" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_.]{3,24}" aria-describedby="username-help"><small id="username-help" class="muted">3–24 lettere, numeri, punti o trattini bassi. Evita nome e cognome.</small></div><div class="field"><label for="schoolclass">La tua classe</label><input id="schoolclass" name="className" placeholder="es. 3B" required pattern="[1-5][A-Za-z]{1,2}" maxlength="3" autocomplete="off"></div><div class="schoolfixed">${icon('book')} Liceo Cartesio – Triggiano</div><div class="checkrow"><input id="age" type="checkbox" required><label for="age">Ho almeno 14 anni</label></div><div class="checkrow"><input id="rules-check" type="checkbox" required><label for="rules-check">Accetto il <button type="button" class="textbtn" data-action="rules">regolamento</button></label></div><button type="submit" class="btn block">Entra in Poleo ${icon('arrow')}</button><button type="button" class="textbtn" data-action="prefill">Compila i campi con un utente demo</button><p class="small muted">Tutto è simulato. Nessuna email, telefono o pagamento. I dati restano in questo browser.</p></form></div>`;}
function home(){return`<section class="hero"><div><span class="badge">Il mercatino della tua scuola</span><h1>Il tuo prossimo libro<br>è già a scuola.</h1><p>Compralo da un compagno. Ritiralo all’intervallo. Dagli un’altra storia.</p><button class="btn" data-action="new-listing">${icon('plus')} Vendi qualcosa</button></div>${art()}</section><div class="searchbar">${icon('search')}<label class="sr" for="search">Cerca per titolo, autore o ISBN</label><input id="search" type="search" value="${esc(ui.q)}" placeholder="Titolo, autore o ISBN" autocomplete="off"><button class="iconbtn" data-action="clear-search" aria-label="Svuota ricerca">✕</button></div><div class="chips" aria-label="Tipo di articolo">${[['','Tutto'],['book','Libri scolastici'],['object','Altri oggetti']].map(([v,t])=>`<button class="chip ${ui.kind===v?'selected':''}" data-action="filter-kind" data-value="${v}" aria-pressed="${ui.kind===v}">${t}</button>`).join('')}</div><div class="chips" aria-label="Filtra per materia">${['',...subjects].map(s=>`<button class="chip ${ui.subject===s?'selected':''}" data-action="filter-subject" data-value="${s}" aria-pressed="${ui.subject===s}">${s||'Tutte le materie'}</button>`).join('')}</div><div class="filters"><div class="chips gradechips" aria-label="Filtra per classe">${['',1,2,3,4,5].map(g=>`<button class="chip ${String(ui.grade)===String(g)?'selected':''}" data-action="filter-grade" data-value="${g}" aria-pressed="${String(ui.grade)===String(g)}">${g?g+'ª':'Tutte'}</button>`).join('')}</div></div><div class="resultshead"><div><h2>Da un banco all’altro</h2><p id="result-count" class="small muted"></p></div><label><span class="sr">Ordina annunci</span><select id="sort" class="sort"><option value="recent" ${ui.sort==='recent'?'selected':''}>Più recenti</option><option value="price" ${ui.sort==='price'?'selected':''}>Prezzo crescente</option></select></label></div><div id="results" class="grid">${results()}</div><p class="demo-footer">Annunci e utenti inventati · Nessun pagamento online · Ritiro dentro la scuola</p>`;}
function filtered(){const q=ui.q.trim().toLocaleLowerCase('it'),nq=validISBN(q)?isbn13(normalizeISBN(q)):q.replace(/[\s-]/g,'');return state.listings.filter(a=>alive(a)&&a.status!=='sold'&&(!ui.kind||a.kind===ui.kind)&&(!ui.subject||a.subject===ui.subject)&&(!ui.grade||a.grade===Number(ui.grade))&&(!q||[a.title,a.authors,a.isbn].some(s=>String(s).toLocaleLowerCase('it').includes(q))||(nq&&a.isbn&&a.isbn.includes(nq)))).sort((a,b)=>ui.sort==='price'?a.price-b.price||b.created-a.created:b.created-a.created);}
function results(){const a=filtered();setTimeout(()=>{if($('#result-count'))$('#result-count').textContent=`${a.length} annunci · massimo 50 €`;},0);return a.length?a.map(card).join(''):empty('Nessun banco da queste parti','Prova un’altra parola oppure rimuovi i filtri.','clear-filters','Mostra tutti gli annunci');}

':a.digital==='unused'?'<div class="notice">Il venditore dichiara che il codice digitale non è stato usato. Verificalo al ritiro.</div>':''}<div><h3>Due parole dal venditore</h3><p class="notes" style="margin-top:12px">${esc(a.notes)||'Nessuna nota aggiuntiva.'}</p></div><div class="row"><span class="avatar">${esc(a.seller.username[0].toUpperCase())}</span><div><strong>${esc(a.seller.username)}</strong><p class="small muted">Classe ${esc(a.seller.className)} · Cartesio</p></div></div>${mine?`<div class="row wrap"><button class="btn" data-action="edit" data-id="${a.id}">${icon('edit')} Modifica</button>${a.status!=='sold'?`<button class="btn light" data-action="sold" data-id="${a.id}">Segna come venduto</button>`:''}</div>`:`<button class="btn block" data-action="contact" data-id="${a.id}" ${a.status==='sold'||(a.status==='reserved'&&a.reservationChat!==c?.id)?'disabled':''}>${icon('chat')} ${a.status==='sold'?'Articolo venduto':a.status==='reserved'?'Apri la chat del ritiro':'Contatta il venditore'}</button>`}<div class="row between"><span class="small muted">${icon('pin')} Ritiro dentro la scuola</span><button class="textbtn" data-action="report" data-id="${a.id}" data-type="listing">Segnala</button></div><p class="source">Dati: ${esc(a.source)}</p></section></div>`;}
function sell(){const a=listing(ui.editId),b=a||{},kind=b.kind||'book';return`<div class="narrow"><div class="pagehead"><button class="iconbtn" data-action="home" aria-label="Torna alla ricerca">${icon('back')}</button><div><h1>${a?'Modifica annuncio':'Fai spazio. Fai felice.'}</h1><p class="muted small">Un libro in meno nello zaino, una possibilità in più.</p></div></div><div class="steps"><span class="current">1 · Raccontalo</span><span>2 · Pubblicalo</span><span>3 · Ritroviamoci</span></div><form id="sellform" class="panel"><div class="formsection"><div class="field"><label for="kind">Cosa vendi?</label><select id="kind" name="kind"><option value="book" ${kind==='book'?'selected':''}>Libro scolastico</option><option value="object" ${kind==='object'?'selected':''}>Altro oggetto</option></select></div><div id="isbn-section" ${kind==='object'?'hidden':''}><div class="isbnrow"><div class="field"><label for="isbn">Parti dall’ISBN <span class="muted">(facoltativo)</span></label><input id="isbn" name="isbn" value="${esc(b.isbn||'')}" placeholder="10 o 13 caratteri" maxlength="25" autocomplete="off" aria-describedby="isbn-result"></div><button class="btn light" type="button" id="lookup-btn" data-action="lookup">Cerca libro</button></div><p id="isbn-result" class="source" role="status" style="margin-top:8px">Open Library → Google Books → catalogo locale.</p><div class="row wrap"><button type="button" class="textbtn" data-action="catalog">Usa il catalogo demo (12 libri)</button><button type="button" class="textbtn" data-action="manual">Inserisci a mano</button></div></div></div><div class="formsection"><h2 style="font-size:22px">I dettagli fanno la differenza</h2><div class="field"><label for="title">Titolo dell’annuncio</label><input id="title" name="title" required maxlength="100" value="${esc(b.title||'')}" placeholder="es. Orizzonti di matematica 3"></div><div id="book-fields" class="formgrid" ${kind==='object'?'hidden':''}><div class="field"><label for="authors">Autori</label><input id="authors" name="authors" maxlength="160" value="${esc(b.authors||'')}" ${kind==='book'?'required':''}></div><div class="field"><label for="publisher">Editore</label><input id="publisher" name="publisher" maxlength="80" value="${esc(b.publisher||'')}" ${kind==='book'?'required':''}></div></div><div class="formgrid"><div class="field"><label for="subject">Materia</label><select id="subject" name="subject">${subjects.map(s=>`<option ${s===(b.subject||'Italiano')?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="grade">Classe consigliata</label><select id="grade" name="grade">${[1,2,3,4,5].map(g=>`<option value="${g}" ${g===(b.grade||Number(state.user.className[0]))?'selected':''}>${g}ª superiore</option>`).join('')}</select></div></div><div class="field"><label for="condition">Stato del libro / oggetto</label><select id="condition" name="condition">${conditions.map((c,i)=>`<option value="${i}" ${i===(b.condition??1)?'selected':''}>${c.name} — ${c.desc} (× ${c.k.toFixed(2).replace('.',',')})</option>`).join('')}</select></div><div class="field"><label for="notes">Note per chi compra</label><textarea id="notes" name="notes" maxlength="800" placeholder="Sottolineature, pagine piegate, accessori inclusi…">${esc(b.notes||'')}</textarea></div><div id="digital-section" ${kind==='object'?'hidden':''}><div class="checkrow"><input id="has-digital" name="hasDigital" type="checkbox" ${b.digital&&b.digital!=='none'?'checked':''}><label for="has-digital">Contiene un codice di attivazione digitale</label></div><div id="digital-options" class="field" ${b.digital&&b.digital!=='none'?'':'hidden'}><label for="digital">Il codice è stato usato?</label><select id="digital" name="digital"><option value="used" ${b.digital==='used'?'selected':''}>Già usato</option><option value="unused" ${b.digital==='unused'?'selected':''}>Non usato</option></select></div><p id="digital-warning" class="notice warn" ${b.digital==='used'?'':'hidden'}>Il codice già usato sarà segnalato chiaramente nell’annuncio.</p></div></div><div class="formsection"><h2 style="font-size:22px">Un prezzo tra compagni</h2><div class="formgrid"><div class="field"><label for="coverPrice">Prezzo di copertina / da nuovo (€)</label><input id="coverPrice" name="coverPrice" type="number" min="0.50" max="2000" step="0.01" inputmode="decimal" required value="${b.coverPrice||''}" placeholder="24,00"></div><div class="field"><label for="price">Il tuo prezzo (€)</label><input id="price" name="price" type="number" min="0.50" max="50" step="0.01" inputmode="decimal" required value="${b.price||''}" placeholder="12,00" aria-describedby="price-warning"></div></div><div class="suggestion"><span class="small">Prezzo suggerito · arrotondato a 0,50 €</span><strong id="suggested-price">—</strong><p id="formula" class="small muted">Inserisci il prezzo da nuovo per vedere il calcolo.</p><button class="textbtn" type="button" data-action="use-suggestion">Usa questo prezzo</button></div><p id="price-warning" class="error-text" role="status" hidden>Il prezzo massimo consentito è 50 €. Scegli un importo tra 0,50 € e 50 €.</p></div><div class="formsection"><h2 style="font-size:22px">Mostralo com’è</h2><p class="small muted">Fino a 3 foto. Ridotte a 800 px e compresse su questo dispositivo.</p><div id="photo-list" class="photo-list">${photoList()}</div><label class="filelabel" for="photos">${icon('camera')} Aggiungi una foto</label><input id="photos" type="file" accept="image/*" capture="environment" multiple aria-label="Scegli fino a tre foto"><p id="photo-status" class="small muted" role="status">Le foto sono facoltative. Senza foto usiamo una copertina illustrata.</p><p id="form-source" class="source">Dati: ${esc(ui.source)}</p><button id="publish" class="btn block" type="submit">${icon('check')} ${a?'Salva modifiche':'Pubblica annuncio'}</button><p class="small muted">Annuncio dimostrativo. Ritiro solo dentro la scuola, nessun pagamento online.</p></div></form></div>`;}
function photoList(){return ui.photos.map((p,i)=>`<div class="photo-item"><img src="${p}" alt="Anteprima foto ${i+1}"><button type="button" data-action="remove-photo" data-index="${i}" aria-label="Rimuovi foto ${i+1}">✕</button></div>`).join('');}
function cancelLookup(){ui.lookup++;lookupController?.abort();}
function normalizeISBN(s){return s.replace(/[\s-]/g,'').toUpperCase();}
function validISBN(s){s=normalizeISBN(s);if(/^\d{9}[\dX]$/.test(s))return [...s].reduce((v,c,i)=>v+(c==='X'?10:Number(c))*(10-i),0)%11===0;if(/^(978|979)\d{10}$/.test(s))return [...s].reduce((v,c,i)=>v+Number(c)*(i%2?3:1),0)%10===0;return false;}
const isbn13=s=>s.length===10?makeISBN('978'+s.slice(0,9)):s;
async function fetchJSON(url){lookupController=new AbortController();const t=setTimeout(()=>lookupController.abort(),5000);try{const r=await fetch(url,{signal:lookupController.signal,referrerPolicy:'no-referrer'});if(!r.ok)throw Error('HTTP');return await r.json();}finally{clearTimeout(t);}}
async function lookup(){const value=normalizeISBN($('#isbn').value);if(!validISBN(value)){$('#isbn-result').className='error-text';$('#isbn-result').textContent='ISBN non valido: controlla le 10 o 13 cifre e la cifra finale (X è ammessa nell’ISBN-10).';$('#isbn').focus();return;}cancelLookup();const ticket=ui.lookup;$('#lookup-btn').disabled=true;$('#isbn-result').className='source';$('#isbn-result').innerHTML='<span class="spinner"></span> Cerco su Open Library (massimo 5 secondi)… Puoi usare subito il catalogo demo.';let book;
try{const j=await fetchJSON(`https://openlibrary.org/api/books?bibkeys=ISBN:${value}&format=json&jscmd=data`);const v=j['ISBN:'+value];if(v?.title)book={title:v.title,authors:(v.authors||[]).map(a=>a.name).join(', '),publisher:(v.publishers||[]).map(p=>p.name).join(', '),isbn:value,source:'Open Library · completa i dati mancanti'};}catch(e){}
if(ticket!==ui.lookup||!$('#isbn'))return;
if(!book){$('#isbn-result').innerHTML='<span class="spinner"></span> Cerco su Google Books (massimo 5 secondi)…';try{const j=await fetchJSON(`https://www.googleapis.com/books/v1/volumes?q=isbn:${value}`);const item=(j.items||[]).find(x=>(x.volumeInfo?.industryIdentifiers||[]).some(id=>isbn13(normalizeISBN(id.identifier))===isbn13(value)));if(item?.volumeInfo?.title){const v=item.volumeInfo;book={title:v.title,authors:(v.authors||[]).join(', '),publisher:v.publisher||'',isbn:value,source:'Google Books · completa i dati mancanti'};const p=item.saleInfo?.retailPrice;if(p?.currencyCode==='EUR')book.coverPrice=p.amount;}}catch(e){}}
if(ticket!==ui.lookup||!$('#isbn'))return;$('#lookup-btn').disabled=false;
if(!book)book=catalog.find(b=>b.isbn===isbn13(value));if(book){fillBook(book);$('#isbn-result').textContent='Dati caricati da '+book.source+'. Controlla edizione, classe e prezzo prima di pubblicare.';}else{$('#isbn-result').textContent='Nessun risultato o rete non disponibile. Scegli un libro demo oppure compila i campi a mano.';openCatalog();}}
function fillBook(b){cancelLookup();if(!$('#sellform'))return;for(const k of ['title','authors','publisher','isbn','coverPrice','subject'])if(b[k]!==undefined&&$('#'+k))$('#'+k).value=String(b[k]);if(b.grades)$('#grade').value=b.grades[0];ui.source=b.source;$('#form-source').textContent='Dati: '+ui.source;$('#lookup-btn').disabled=false;updateSuggestion(true);}
function openCatalog(){cancelLookup();if($('#lookup-btn'))$('#lookup-btn').disabled=false;openModal('Il catalogo demo',`<p class="small muted">12 libri scolastici inventati, con ISBN dal checksum valido. Puoi usarli anche senza connessione.</p>${catalog.map((b,i)=>`<button class="catalogitem" data-action="catalog-pick" data-index="${i}"><strong>${esc(b.title)}</strong><small>${esc(b.subject)} · ${b.grades.map(g=>g+'ª').join('/')} · ${money(b.coverPrice)}<br>ISBN ${b.isbn}</small></button>`).join('')}`);}
function updateSuggestion(setPrice){if(!$('#coverPrice'))return;const p=Number($('#coverPrice').value),c=conditions[Number($('#condition').value)],raw=p*c.k,s=Math.round(raw*2)/2;$('#suggested-price').textContent=p>0?money(s):'—';$('#formula').textContent=p>0?`${money(p)} × ${c.k.toFixed(2).replace('.',',')} = ${money(raw)} → ${money(s)} arrotondato`:'Inserisci il prezzo da nuovo per vedere il calcolo.';if(setPrice&&p>0)$('#price').value=Math.max(.5,s).toFixed(2);$('#price-warning').hidden=!(Number($('#price').value)>50||Number($('#price').value)<0);}
function messages(){return`<div class="narrow"><div class="pagehead"><div><h1>Due parole, un accordo.</h1><p class="muted small">Le tue conversazioni restano qui, tra compagni.</p></div></div><div class="notice" style="margin-bottom:20px">${icon('shield')} Chat demo: risposte automatiche. Non condividere contatti o dati personali.</div><div class="inbox">${state.chats.length?[...state.chats].sort((a,b)=>(b.messages.at(-1)?.at||0)-(a.messages.at(-1)?.at||0)).map(c=>{const a=listing(c.listingId),last=c.messages.at(-1);return`<button class="chatrow" data-action="open-chat" data-id="${c.id}"><span class="avatar">${esc(c.other.username[0].toUpperCase())}</span><span class="grow"><strong>${esc(c.other.username)} ${c.unread?'<span class="badge warn">Nuovo</span>':''}</strong><span class="small muted">${esc(a?.title||'Annuncio rimosso')}</span><span class="preview">${last?.type==='pickup'?'Proposta di ritiro a scuola':esc(last?.text||'Inizia la conversazione')}</span></span><time>${last?time(last.at):''}</time></button>`;}).join(''):empty('Il primo “ciao” parte da un libro','Apri un annuncio e contatta il venditore. Qui troverai la vostra chat.','home','Trova un libro')}</div></div>`;}
function chat(){const c=state.chats.find(c=>c.id===ui.chatId),a=listing(c?.listingId);if(!c)return empty('Nessuna conversazione selezionata','Scegli una chat dai messaggi.','messages','Apri messaggi');return`<div class="chatroom"><div class="pagehead"><button class="iconbtn" data-action="messages" aria-label="Torna ai messaggi">${icon('back')}</button><span class="avatar">${esc(c.other.username[0].toUpperCase())}</span><div class="grow"><h2 style="font-size:20px">${esc(c.other.username)}</h2><p class="small muted">${esc(c.other.className)} · risposte simulate</p></div><button class="iconbtn" data-action="report" data-type="chat" data-id="${c.id}" aria-label="Segnala questa chat">${icon('flag')}</button></div><button class="chatrow" data-action="detail" data-id="${c.listingId}"><span class="tinycover">${icon(a?.kind==='object'?'bag':'book')}</span><span class="grow"><strong>${esc(a?.title||'Annuncio rimosso')}</strong><span class="small">${a?money(a.price):''} · ${!alive(a)?'Non disponibile':a.status==='reserved'?'Prenotato':a.status==='sold'?'Venduto':'Disponibile'}${reviewed(c.listingId)?' · In revisione':''}</span></span>${icon('arrow')}</button><div id="conversation" class="conversation" aria-label="Messaggi della conversazione" aria-live="polite">${chatMessages(c)}</div><div id="chat-status">${chatActions(c)}</div><div id="typing" class="typing" role="status">${c.pending?'Il compagno sta scrivendo…':''}</div><form id="composer" class="composer"><label class="sr" for="message">Messaggio</label><input id="message" name="message" maxlength="500" required placeholder="Scrivi un messaggio…" autocomplete="off" ${!alive(a)?'disabled':''}><button class="btn" type="submit" aria-label="Invia messaggio" ${!alive(a)?'disabled':''}>${icon('send')}</button></form></div>`;}
function chatMessages(c){return c.messages.map(m=>m.type==='pickup'?`<div class="pickup ${m.status}"><div class="row between"><strong>${icon('calendar')} ${m.status==='accepted'?'Ritiro confermato':m.status==='superseded'?'Proposta precedente':'Proposta di ritiro'}</strong><span class="small muted">${m.from==='me'?'Tu':esc(c.other.username)}</span></div><p>${esc(dateLabel(m.date))} · <strong>${esc(m.moment)}</strong><br>${esc(m.place)} · dentro la scuola</p>${m.status==='pending'&&alive(listing(c.listingId))&&listing(c.listingId).status==='available'?m.from==='other'?`<div class="row wrap"><button class="btn" data-action="accept-pickup" data-id="${m.id}">${icon('check')} Accetta</button><button class="btn outline" data-action="pickup" data-id="${c.id}">Proponi altro</button></div>`:`<p class="small muted">In attesa della conferma del compagno…</p><button class="btn outline" data-action="pickup" data-id="${c.id}">Proponi altro</button>`:''}${m.status==='accepted'?'<span class="badge">Accordo preso · annuncio prenotato</span>':''}</div>`:m.type==='system'?`<p class="system">${esc(m.text)}</p>`:`<div class="bubble ${m.from==='me'?'me':''}">${esc(m.text)}<time>${time(m.at)}</time></div>`).join('');}
function chatActions(c){const a=listing(c.listingId);if(!alive(a))return'<p class="notice warn">Annuncio rimosso. La conversazione resta consultabile.</p>';if(a.status==='sold')return'<p class="notice">Consegna completata · articolo venduto. Grazie per avergli dato una seconda vita.</p>';if(a.status==='reserved'){if(a.reservationChat!==c.id)return'<p class="notice warn">Articolo prenotato in un’altra conversazione.</p>';return`<div class="notice"><strong>Ci vediamo a scuola!</strong><p class="small">Controllate insieme l’articolo prima di concludere.</p></div><div class="row wrap" style="margin-top:12px">${isOwn(a)?`<button class="btn" data-action="sold" data-id="${a.id}">Segna come venduto</button>`:`<button class="btn light" data-action="simulate-sale" data-id="${a.id}">Demo: simula consegna del venditore</button>`}<button class="textbtn" data-action="cancel-reservation" data-id="${a.id}">Annulla prenotazione</button></div>`;}return`<button class="btn light block" data-action="pickup" data-id="${c.id}">${icon('calendar')} Proponi ritiro a scuola</button>`;}
function scrollChat(){const box=$('#conversation');if(box)box.scrollTop=box.scrollHeight;}
function refreshChat(c){navigation();if(ui.view==='chat'&&ui.chatId===c.id){$('#conversation').innerHTML=chatMessages(c);$('#typing').textContent=c.pending?'Il compagno sta scrivendo…':'';$('#chat-status').innerHTML=chatActions(c);scrollChat();}else if(ui.view==='messages')render();}
function openChat(id){const c=state.chats.find(c=>c.id===id);if(!c)return;commit(()=>c.unread=0);ui.chatId=id;go('chat');}
function pending(c,kind,data={}){c.pending={kind,...data,due:Date.now()+1400};}
function arm(c){if(!c.pending||timers.has(c.id))return;const timer=setTimeout(()=>{timers.delete(c.id);reply(c.id);},Math.max(100,c.pending.due-Date.now()));timers.set(c.id,timer);}
function reply(id){const c=state.chats.find(c=>c.id===id);if(!c?.pending)return;const p=c.pending,a=listing(c.listingId);if(!commit(()=>{delete c.pending;if(!alive(a)||a.status==='sold')return;let text=p.kind==='hello'?`Ciao! Sì, è disponibile 😊 Sono in ${c.other.className}. Puoi propormi un ritiro qui sotto: ci troviamo dentro la scuola.`:'Va bene! Scriviamoci qui per i dettagli, poi ci vediamo a scuola.';if(p.kind==='pickup'){const m=c.messages.find(m=>m.id===p.messageId);if(m?.status==='pending'&&a.status==='available'){m.status='superseded';text='Per me va bene! Ti confermo gli stessi dettagli: accetta il ritiro qui sotto e l’articolo è prenotato.';c.messages.push({id:uid(),type:'text',from:'other',text,at:Date.now()});c.messages.push({id:uid(),type:'pickup',from:'other',date:m.date,moment:m.moment,place:m.place,status:'pending',at:Date.now()});}else return;}else c.messages.push({id:uid(),type:'text',from:'other',text,at:Date.now()});if(ui.view!=='chat'||ui.chatId!==id)c.unread=(c.unread||0)+1;}))return;refreshChat(c);}
function contact(id){const a=listing(id);if(!alive(a)||a.status==='sold')return;let c=state.chats.find(c=>c.listingId===id);if(!c){if(a.status!=='available')return;c={id:uid(),listingId:id,other:a.seller,unread:0,messages:[{id:uid(),type:'text',from:'me',text:'Ciao! Mi interessa il tuo annuncio. È ancora disponibile?',at:Date.now()}]};pending(c,'hello');if(!commit(()=>state.chats.push(c)))return;arm(c);}openChat(c.id);}
function pickupModal(id){const c=state.chats.find(c=>c.id===id),a=listing(c?.listingId);if(!c||!alive(a)||a.status!=='available')return toast('Questo articolo non è disponibile per un nuovo ritiro.');openModal('Ci vediamo a scuola',`<form id="pickupform" data-id="${c.id}" class="stack"><p class="small muted">Scegli tra i prossimi 5 giorni da lunedì a sabato. Verifica con il compagno eventuali festività o chiusure.</p><div class="field"><label for="pickup-date">Giorno</label><select id="pickup-date" name="date">${schoolDays().map(d=>`<option value="${d}">${dateLabel(d)}</option>`).join('')}</select></div><div class="field"><label for="pickup-moment">Momento</label><select id="pickup-moment" name="moment"><option>Prima delle lezioni</option><option selected>Intervallo</option><option>Fine lezioni</option></select></div><div class="field"><label for="pickup-place">Luogo · sempre dentro la scuola</label><select id="pickup-place" name="place"><option>Atrio</option><option>Biblioteca</option></select></div><div class="notice">Controllate il libro e il codice digitale insieme. Concordate ogni dettaglio nella chat.</div><button class="btn" type="submit">Invia proposta ${icon('arrow')}</button></form>`);}
function acceptPickup(id){const c=state.chats.find(c=>c.id===ui.chatId),m=c?.messages.find(m=>m.id===id),a=listing(c?.listingId);if(!m||m.from!=='other'||m.status!=='pending'||!alive(a)||a.status!=='available')return toast('La proposta non è più disponibile.');if(commit(()=>{for(const ch of state.chats.filter(ch=>ch.listingId===a.id)){ch.messages.forEach(x=>{if(x.type==='pickup'&&x.status==='pending')x.status='superseded';});delete ch.pending;}m.status='accepted';a.status='reserved';a.reservationChat=c.id;c.messages.push({id:uid(),type:'system',text:'Ritiro accettato. L’annuncio è ora prenotato.',at:Date.now()});})){render();toast('Ritiro confermato. L’articolo è prenotato!');}}
function profile(){const mine=state.listings.filter(a=>alive(a)&&isOwn(a)),sold=mine.filter(a=>a.status==='sold'),saved=sold.reduce((s,a)=>s+Math.max(0,a.coverPrice-a.price),0),reserved=state.listings.filter(a=>alive(a)&&a.status==='reserved'&&a.reservationChat&&state.chats.some(c=>c.id===a.reservationChat)&&!isOwn(a));return`<div class="narrow"><div class="profilehero"><span class="avatar">${esc(state.user.username[0].toUpperCase())}</span><div><h1 style="font-size:28px">${esc(state.user.username)}</h1><p class="muted">${esc(state.user.className)} · Liceo Cartesio</p><span class="badge">Profilo demo</span></div></div><div class="stats"><div class="stat">${icon('leaf')}<strong>${money(saved)}</strong><p>Hai fatto risparmiare ai compagni</p></div><div class="stat">${icon('book')}<strong>${sold.length}</strong><p>Articoli venduti</p></div></div><section class="profile-section"><div class="row between" style="margin-bottom:16px"><h2 style="margin:0">I miei annunci</h2><button class="btn light" data-action="new-listing">${icon('plus')} Nuovo</button></div><div class="stack">${mine.length?mine.map(a=>`<article class="manageitem"><div class="row between"><strong>${esc(a.title)}</strong>${statusBadge(a)}</div><p class="small muted">${money(a.price)} · ${conditions[a.condition].name}</p><div class="row wrap"><button class="btn outline" data-action="detail" data-id="${a.id}">Apri</button><button class="btn outline" data-action="edit" data-id="${a.id}">${icon('edit')} Modifica</button>${a.status!=='sold'?`<button class="btn light" data-action="sold" data-id="${a.id}">Segna venduto</button>`:''}<button class="btn danger" data-action="delete" data-id="${a.id}" aria-label="Elimina ${esc(a.title)}">${icon('trash')}</button></div></article>`).join(''):empty('Fai spazio al prossimo anno','Pubblica il tuo primo libro o un oggetto che non usi più.','new-listing','Crea un annuncio')}</div></section><section class="profile-section"><h2>I libri e gli oggetti prenotati</h2><div class="stack">${reserved.length?reserved.map(a=>`<div class="manageitem"><strong>${esc(a.title)}</strong><p class="small muted">${esc(a.seller.username)} · ${money(a.price)}</p><button class="btn light" data-action="open-chat" data-id="${a.reservationChat}">Vedi ritiro e chat ${icon('arrow')}</button></div>`).join(''):empty('Nessun ritiro in programma','Quando accetti una proposta di ritiro, ritrovi qui l’articolo.')}</div></section><section class="profile-section"><h2>${icon('shield')} Moderazione (demo)</h2><p class="small muted" style="margin-bottom:16px">Pannello dimostrativo dei rappresentanti. Nella versione reale sarebbe riservato ai moderatori.</p><div class="stack">${state.reports.length?[...state.reports].reverse().map(r=>`<article class="manageitem"><div class="row between"><strong>${r.type==='chat'?'Chat: ':''}${esc(r.title)}</strong><span class="badge ${r.status==='pending'?'warn':''}">${({pending:'Da valutare',ignored:'Ignorata',removed:'Annuncio rimosso'})[r.status]}</span></div><p class="small">${esc(r.reason)}${r.details?' · '+esc(r.details):''}</p><p class="small muted">Segnalata da ${esc(r.by)} · ${elapsed(r.created)}</p>${r.status==='pending'?`<div class="row wrap"><button class="btn danger" data-action="moderate-remove" data-id="${r.id}">Rimuovi annuncio</button><button class="btn outline" data-action="moderate-ignore" data-id="${r.id}">Ignora</button></div>`:''}</article>`).join(''):empty('Tutto tranquillo, per ora','Le segnalazioni sugli annunci e sulle chat arriveranno qui per essere valutate.')}</div></section><section class="profile-section"><h2>Le cose da sapere</h2><div class="linklist"><button data-action="install-app">Installa Poleo sul telefono ${icon('arrow')}</button><button data-action="about">La demo, in breve ${icon('arrow')}</button><button data-action="rules">Regolamento ${icon('arrow')}</button><button data-action="privacy">Privacy in parole semplici ${icon('arrow')}</button><button data-action="reset">Ripristina demo ${icon('reset')}</button></div></section><p class="demo-footer">Poleo · Pensato per il Cartesio, progettato per riusare.<br>Prototipo indipendente · Non è un servizio ufficiale della scuola.</p></div>`;}
function openModal(title,html){$('#modal-title').textContent=title;$('#modal-body').innerHTML=html;if(!$('#modal').open)$('#modal').showModal();}
function closeModal(){$('#modal').close();}
function rules(){openModal('Il regolamento, senza paroloni',`<ol><li><strong>Almeno 14 anni.</strong> Usa un nome utente e indica la tua classe. Niente nome completo o dati di altre persone.</li><li><strong>Solo cose che puoi vendere.</strong> Libri originali e oggetti tuoi, leciti e adatti alla scuola. Vietati copie pirata, armi, alcol, tabacco, farmaci e contenuti offensivi.</li><li><strong>Racconta la verità.</strong> Indica difetti, pagine mancanti e stato del codice digitale. Un libro “rovinato” deve comunque essere completo.</li><li><strong>Massimo 50 € per annuncio.</strong> Il prezzo suggerito è un aiuto. Controlla ISBN ed edizione adottata: la classe indicata è solo un consiglio.</li><li><strong>Accordatevi qui.</strong> Ritiro solo dentro la scuola, in un momento e luogo consentiti. Verificate insieme l’oggetto. Non pubblicare telefono o indirizzo.</li><li><strong>Rispetto prima di tutto.</strong> Se qualcosa non va, usa “Segnala”. I moderatori possono rimuovere annunci. Per acquisti reali coinvolgi un genitore quando necessario.</li></ol><div class="notice">Questa è una demo: utenti, libri e scambi sono inventati. Non si paga e non si conclude alcuna vendita reale. L’iniziativa non è ufficialmente autorizzata dalla scuola.</div>`);}
function privacy(){openModal('Privacy in parole semplici',`<p><strong>Ti chiediamo solo un nome utente e la classe.</strong> Nessuna email, telefono, indirizzo o posizione GPS.</p><p>In questa demo profilo, annunci, foto, chat e segnalazioni sono salvati nel browser con localStorage. Non vengono inviati a un server di Poleo. Chi usa questo stesso browser può consultarli. La versione installabile conserva anche i file dell’app nella cache per aprirsi senza connessione; nessuna chat o foto viene caricata online.</p><p>Le foto sono ridimensionate sul dispositivo. Evita volti e dati personali. Usa “Ripristina demo” per cancellare il profilo e tutti i contenuti aggiunti.</p><p>Solo se premi “Cerca libro”, l’ISBN viene inviato a Open Library e Google Books. Questi servizi ricevono anche i normali dati tecnici della richiesta di rete. Il catalogo demo funziona senza rete.</p><p>Le segnalazioni sarebbero gestite da moderatori autorizzati. Qui il pannello è aperto per mostrare il funzionamento. Non esistono account verificati o protezioni per acquisti reali.</p><div class="notice">Per lanciare un servizio reale serviranno regole e informativa complete, autorizzazioni e gestione sicura degli account.</div>`);}
function reportModal(type,id){const c=type==='chat'?state.chats.find(c=>c.id===id):null,a=listing(c?.listingId||id);if(!a)return;openModal('Qualcosa non va?',`<form id="reportform" class="stack" data-type="${type}" data-id="${id}" data-listing="${a.id}"><p class="small muted">Segnala ${type==='chat'?'questa conversazione':'questo annuncio'}: ${esc(a.title)}.</p><div class="field"><label for="reason">Motivo</label><select id="reason" name="reason"><option>Annuncio falso o truffa</option><option>Contenuto inappropriato</option><option>Prezzo scorretto</option><option>Altro</option></select></div><div class="field"><label for="report-details">Spiegaci meglio <span id="reason-hint" class="muted">(facoltativo)</span></label><textarea id="report-details" name="details" maxlength="500" placeholder="Non inserire dati personali."></textarea></div><button class="btn" type="submit">${icon('flag')} Invia segnalazione</button></form>`);}
function markSold(id,simulate=false){const a=listing(id);if(!alive(a)||a.status==='sold'||(!isOwn(a)&&!simulate))return;if(simulate&&!(a.status==='reserved'&&a.reservationChat&&state.chats.some(c=>c.id===a.reservationChat)))return;if(commit(()=>{a.status='sold';a.soldAt=Date.now();state.chats.filter(c=>c.listingId===id).forEach(c=>{delete c.pending;c.messages.push({id:uid(),type:'system',text:'Il venditore ha confermato la consegna: articolo venduto.',at:Date.now()});});})){render();toast('Consegna completata! L’annuncio non appare più nella ricerca.');}}
function edit(id){const a=listing(id);if(!alive(a)||!isOwn(a))return;ui.editId=id;ui.photos=[...a.photos];ui.source=a.source;go('sell');}
function newListing(){cancelLookup();ui.editId=null;ui.photos=[];ui.source='Inserimento manuale';go('sell');}
async function compress(file){if(!file.type.startsWith('image/'))throw Error('Scegli una foto in formato immagine.');if(file.size>20000000)throw Error('Questa foto supera 20 MB. Scegli un file più piccolo.');const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>no(Error('Non riesco a leggere questa foto.'));r.readAsDataURL(file);});const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(Error('Formato foto non supportato: prova JPEG o PNG.'));i.src=data;});const scale=Math.min(1,800/Math.max(img.naturalWidth,img.naturalHeight)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.naturalWidth*scale));canvas.height=Math.max(1,Math.round(img.naturalHeight*scale));const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.7);}
async function uploadPhotos(input){const free=3-ui.photos.length;if(input.files.length>free)toast(`Puoi aggiungere ancora ${Math.max(0,free)} foto (massimo 3).`);const files=[...input.files].slice(0,free);if(!files.length){input.value='';return;}ui.photoBusy=true;$('#publish').disabled=true;$('#photo-status').textContent='Sto preparando le foto…';const form=$('#sellform');for(const f of files){try{const photo=await compress(f);if(!form.isConnected)break;ui.photos.push(photo);}catch(e){toast(e.message);}}ui.photoBusy=false;if(form.isConnected){$('#publish').disabled=false;$('#photo-list').innerHTML=photoList();$('#photo-status').textContent=`${ui.photos.length}/3 foto pronte · JPEG, massimo 800 px.`;input.value='';}}
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.q=e.target.value;refreshResults();}if(['coverPrice','condition'].includes(e.target.id))updateSuggestion(!$('#price').dataset.custom);if(e.target.id==='price'){e.target.dataset.custom='1';updateSuggestion(false);}});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='sort'){ui.sort=e.target.value;refreshResults();}if(id==='condition')updateSuggestion(!$('#price').dataset.custom);if(id==='photos')uploadPhotos(e.target);if(id==='has-digital'||id==='digital'){$('#digital-options').hidden=!$('#has-digital').checked;$('#digital-warning').hidden=!($('#has-digital').checked&&$('#digital').value==='used');}if(id==='reason'){$('#report-details').required=e.target.value==='Altro';$('#reason-hint').textContent=e.target.value==='Altro'?'(obbligatorio)':'(facoltativo)';}if(id==='kind'){cancelLookup();$('#lookup-btn').disabled=false;const book=e.target.value==='book';for(const s of ['#isbn-section','#book-fields','#digital-section'])$(s).hidden=!book;$('#authors').required=book;$('#publisher').required=book;if(!book){$('#subject').value='Altro';ui.source='Inserimento manuale';$('#form-source').textContent='Dati: '+ui.source;}}});
document.addEventListener('submit',e=>{const f=e.target;e.preventDefault();if(!f.reportValidity())return;const d=new FormData(f);
if(f.id==='onboarding'){const username=d.get('username').trim(),className=d.get('className').trim().toUpperCase();if(!$('#age').checked||!$('#rules-check').checked)return;if(commit(()=>{state.user={username,className};const b=catalog[5];state.listings.push({...b,id:'mio-libro',grade:b.grades[0],condition:1,price:15,photos:[],notes:'Usato con cura, qualche sottolineatura a matita. Consegna all’intervallo.',digital:'none',sellerId:SELF,seller:{username,className},status:'available',created:Date.now()-3600000});const old=catalog[9];state.listings.push({...old,id:'mio-venduto',grade:1,condition:1,price:12,photos:[],notes:'Annuncio demo già consegnato.',digital:'none',sellerId:SELF,seller:{username,className},status:'sold',created:Date.now()-86400000,soldAt:Date.now()-43200000});})){go('home');toast('Benvenuto! La demo è pronta, con due annunci nel tuo profilo.');}}
if(f.id==='sellform'){if(ui.photoBusy)return toast('Attendi che le foto siano pronte.');const book=d.get('kind')==='book',isbn=normalizeISBN(String(d.get('isbn')||''));if(book&&isbn&&!validISBN(isbn))return toast('Correggi l’ISBN oppure lascialo vuoto per un inserimento manuale.');const price=Number(d.get('price')),coverPrice=Number(d.get('coverPrice'));if(!Number.isFinite(price)||price<.5||price>50||!Number.isFinite(coverPrice)||coverPrice<.5)return toast('Controlla i prezzi: la vendita deve essere tra 0,50 € e 50 €.');const title=d.get('title').trim(),authors=String(d.get('authors')||'').trim(),publisher=String(d.get('publisher')||'').trim();if(!title||(book&&(!authors||!publisher)))return toast('Compila titolo, autori ed editore senza lasciare solo spazi.');const old=listing(ui.editId);if(old?.status==='reserved'&&(old.price!==price||old.title!==title))return toast('Annulla prima la prenotazione nella chat per cambiare titolo o prezzo.');const a={...(old||{}),id:old?.id||uid(),title,authors:book?authors:'',publisher:book?publisher:'',isbn:book?isbn:'',kind:book?'book':'object',subject:d.get('subject'),grade:Number(d.get('grade')),condition:Number(d.get('condition')),coverPrice,price,notes:d.get('notes').trim(),digital:book&&$('#has-digital').checked?d.get('digital'):'none',photos:[...ui.photos],source:ui.source,sellerId:SELF,seller:{...state.user},status:old?.status||'available',created:old?.created||Date.now()};if(commit(()=>{if(old)state.listings[state.listings.indexOf(old)]=a;else state.listings.push(a);})){ui.listingId=a.id;ui.photoIndex=0;go('detail');toast(old?'Annuncio aggiornato.':'Pubblicato! Il tuo annuncio è nel mercatino.');}}
if(f.id==='composer'){const c=state.chats.find(c=>c.id===ui.chatId),a=listing(c?.listingId),text=d.get('message').trim();if(!c||!alive(a)||!text)return;if(commit(()=>{c.messages.push({id:uid(),type:'text',from:'me',text,at:Date.now()});if(!c.pending&&a.status!=='sold')pending(c,'text');})){f.reset();refreshChat(c);arm(c);}}
if(f.id==='pickupform'){const c=state.chats.find(c=>c.id===f.dataset.id),a=listing(c?.listingId);if(!c||!alive(a)||a.status!=='available')return toast('Annuncio non più disponibile.');if(!schoolDays().includes(d.get('date')))return toast('Scegli uno dei prossimi giorni disponibili.');const m={id:uid(),type:'pickup',from:'me',date:d.get('date'),moment:d.get('moment'),place:d.get('place'),status:'pending',at:Date.now()};if(commit(()=>{c.messages.forEach(x=>{if(x.type==='pickup'&&x.status==='pending')x.status='superseded';});c.messages.push(m);pending(c,'pickup',{messageId:m.id});})){clearTimeout(timers.get(c.id));timers.delete(c.id);closeModal();refreshChat(c);arm(c);toast('Proposta inviata al compagno.');}}
if(f.id==='reportform'){const a=listing(f.dataset.listing),details=d.get('details').trim();if(d.get('reason')==='Altro'&&!details)return toast('Spiega il motivo della segnalazione.');if(commit(()=>state.reports.push({id:uid(),listingId:a.id,chatId:f.dataset.type==='chat'?f.dataset.id:null,type:f.dataset.type,title:a.title,reason:d.get('reason'),details,by:state.user.username,status:'pending',created:Date.now()}))){closeModal();render();toast('Segnalazione inviata ai moderatori');}}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const act=b.dataset.action,id=b.dataset.id;
switch(act){case'nav':if(b.dataset.view==='sell')newListing();else go(b.dataset.view);break;case'home':if(state.user)go('home');break;case'messages':go('messages');break;case'new-listing':newListing();break;case'clear-search':ui.q='';$('#search').value='';refreshResults();$('#search').focus();break;case'filter-kind':ui.kind=b.dataset.value;render();break;case'filter-subject':ui.subject=b.dataset.value;render();break;case'filter-grade':ui.grade=b.dataset.value;render();break;case'clear-filters':ui.q='';ui.subject='';ui.grade='';ui.kind='';render();break;case'detail':ui.listingId=id;ui.photoIndex=0;go('detail');break;case'photo':ui.photoIndex=Number(b.dataset.index);render();break;case'edit':edit(id);break;case'lookup':lookup();break;case'catalog':openCatalog();break;case'catalog-pick':fillBook(catalog[Number(b.dataset.index)]);$('#isbn-result').textContent='Dati caricati dal catalogo locale demo.';closeModal();break;case'manual':cancelLookup();$('#lookup-btn').disabled=false;ui.source='Inserimento manuale';$('#form-source').textContent='Dati: '+ui.source;$('#isbn-result').textContent='Puoi lasciare l’ISBN vuoto e compilare i dettagli.';$('#title').focus();break;case'use-suggestion':updateSuggestion(true);delete $('#price').dataset.custom;break;case'remove-photo':ui.photos.splice(Number(b.dataset.index),1);$('#photo-list').innerHTML=photoList();break;case'contact':contact(id);break;case'open-chat':openChat(id);break;case'pickup':pickupModal(id);break;case'accept-pickup':acceptPickup(id);break;case'sold':markSold(id);break;case'simulate-sale':markSold(id,true);break;case'cancel-reservation':{const a=listing(id);if(!alive(a)||a.status!=='reserved')break;if(commit(()=>{a.status='available';delete a.reservationChat;state.chats.filter(c=>c.listingId===id).forEach(c=>{c.messages.forEach(m=>{if(m.type==='pickup'&&m.status==='accepted')m.status='superseded';});c.messages.push({id:uid(),type:'system',text:'Prenotazione annullata. L’articolo è di nuovo disponibile.',at:Date.now()});});})){render();toast('Prenotazione annullata.');}break;}case'report':reportModal(b.dataset.type,id);break;case'moderate-ignore':if(commit(()=>{const r=state.reports.find(r=>r.id===id);if(r)r.status='ignored';})){render();toast('Segnalazione archiviata.');}break;case'moderate-remove':{const r=state.reports.find(r=>r.id===id);if(!r)break;if(commit(()=>{const a=listing(r.listingId);if(a){a.status='removed';delete a.reservationChat;}state.reports.filter(x=>x.listingId===r.listingId&&x.status==='pending').forEach(x=>x.status='removed');state.chats.filter(c=>c.listingId===r.listingId).forEach(c=>{delete c.pending;c.messages.push({id:uid(),type:'system',text:'L’annuncio è stato rimosso dalla moderazione demo.',at:Date.now()});});})){render();toast('Annuncio rimosso dal mercatino.');}break;}case'delete':openModal('Eliminare l’annuncio?',`<p>L’annuncio sarà tolto dal mercatino. Le eventuali chat resteranno consultabili.</p><button class="btn danger" data-action="confirm-delete" data-id="${id}">Elimina annuncio</button><button class="btn outline" data-action="close-modal">Annulla</button>`);break;case'confirm-delete':{const a=listing(id);if(!isOwn(a))break;if(commit(()=>{a.status='deleted';delete a.reservationChat;state.chats.filter(c=>c.listingId===id).forEach(c=>delete c.pending);})){closeModal();go('profile');toast('Annuncio eliminato.');}break;}case'rules':rules();break;case'privacy':privacy();break;case'close-modal':closeModal();break;case'prefill':$('#username').value='ale_3B';$('#schoolclass').value='3B';$('#age').focus();break;case'about':openModal('Poleo, pronto da provare',`<p>Un mercatino pensato per il Liceo Cartesio di Triggiano: soprattutto libri, ma anche oggetti che meritano un’altra vita.</p><div class="notice">Tutti gli utenti e gli annunci iniziali sono inventati. Le chat rispondono automaticamente. Nessun login o pagamento reale.</div><p class="small muted">Per presentarlo: cerca un libro, contatta il venditore, proponi un ritiro, accetta la sua conferma e simula la consegna. Nel Profilo trovi i tuoi annunci e la moderazione demo.</p><button class="btn outline" data-action="reset">Ripristina la demo</button>`);break;case'reset':openModal('Ripartiamo da zero?',`<p>Verranno cancellati da questo browser il profilo, le foto, gli annunci aggiunti, le chat e le segnalazioni. Torneranno i dati iniziali.</p><button class="btn danger" data-action="confirm-reset">Sì, ripristina demo</button><button class="btn outline" data-action="close-modal">Annulla</button>`);break;case'confirm-reset':{cancelLookup();for(const t of timers.values())clearTimeout(t);timers.clear();const fresh=seed();if(commit(()=>state=fresh)){ui.view='home';ui.q='';ui.subject='';ui.grade='';ui.kind='';ui.sort='recent';ui.editId=null;ui.photos=[];closeModal();render();toast('Demo ripristinata. Pronta per la prossima presentazione.');}break;}}
});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal();}});
try{if(storageOK)localStorage.setItem(KEY,JSON.stringify(state));}catch(e){storageOK=false;}

<script>
(() => {
  'use strict';
  let installPrompt = null;
  const installed = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const button = document.getElementById('install-poleo');
  function updateInstallButton() { if (button) button.textContent = installed() ? 'App installata' : 'Installa app'; }
  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    installPrompt = event;
    document.documentElement.dataset.installAvailable = 'true';
  });
  window.addEventListener('appinstalled', () => { installPrompt = null; updateInstallButton(); });
  const offlineText = () => document.documentElement.dataset.offlineReady === 'true'
    ? '<div class="notice">Modalità offline pronta. Puoi riaprire Poleo anche senza connessione.</div>'
    : '<div class="notice">Prima della presentazione, apri Poleo una volta con Internet e attendi qualche secondo: così prepari anche la modalità offline.</div>';
  function showInstallHelp() {
    const modal = document.getElementById('modal');
    document.getElementById('modal-title').textContent = installed() ? 'Poleo è già un’app' : 'Poleo, anche sul telefono';
    document.getElementById('modal-body').innerHTML = installed()
      ? '<p>Stai già usando Poleo dalla sua icona, nella finestra dedicata.</p>' + offlineText()
      : '<p><strong>Su Android, apri questo sito in Chrome.</strong> Nel menu ⋮ scegli <strong>“Aggiungi a schermata Home”</strong> e poi <strong>“Installa”</strong>. Su Samsung Internet cerca <strong>“Aggiungi pagina a” → “Schermata Home”</strong>.</p><p>Su iPhone: apri in Safari, premi <strong>Condividi → Aggiungi alla schermata Home</strong>.</p><p>Comparirà l’icona Poleo: toccala per avviare la demo come app. L’installazione è gratuita e non richiede il Play Store.</p>' + offlineText();
    if (!modal.open) modal.showModal();
  }
  document.addEventListener('click', async event => {
    const target = event.target.closest('[data-action="install-app"]');
    if (!target) return;
    if (installed() || !installPrompt) return showInstallHelp();
    const prompt = installPrompt;
    installPrompt = null;
    try { await prompt.prompt(); await prompt.userChoice; }
    catch (_) { showInstallHelp(); }
  });
  if ('serviceWorker' in navigator && ['https:', 'http:'].includes(location.protocol)) {
    navigator.serviceWorker.register('./sw.js', {scope: './'})
      .then(() => navigator.serviceWorker.ready)
      .then(() => { document.documentElement.dataset.offlineReady = 'true'; })
      .catch(() => { document.documentElement.dataset.offlineReady = 'false'; });
  }
  updateInstallButton();
})();
</script>
</body>
</html>
